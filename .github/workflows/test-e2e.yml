name: E2E test with video recording
run-name: "Issue 12798 · direct tagged-app verification"
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35164325012
          name: reload-issue-12798-terminal-links-same-macos
          path: downloaded-app
      - name: Prepare tagged app and virtual display
        run: |
          set -euo pipefail
          archive=$(find downloaded-app -name '*.zip' -print -quit)
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/terminal-link-app"
          ditto -x -k "$archive" "$RUNNER_TEMP/terminal-link-app"
          app="$RUNNER_TEMP/terminal-link-app/cmux DEV issue-12798-terminal-links-same.app"
          codesign --force --deep --sign - "$app"
          echo "CMUX_LINK_APP=$app" >> "$GITHUB_ENV"
          echo "CMUX_LINK_OUTPUT=$RUNNER_TEMP/terminal-link-evidence" >> "$GITHUB_ENV"
          clang -framework Foundation -framework CoreGraphics -o /tmp/create-virtual-display scripts/create-virtual-display.m
          /tmp/create-virtual-display --ready-path "$RUNNER_TEMP/verify-display.ready" --display-id-path "$RUNNER_TEMP/verify-display.id" > "$RUNNER_TEMP/verify-display.log" 2>&1 &
          for _ in $(seq 1 100); do
            test -s "$RUNNER_TEMP/verify-display.ready" && break
            sleep 0.1
          done
          test -s "$RUNNER_TEMP/verify-display.ready"
      - name: Verify clicks and open commands in the running tagged app
        run: |
          scripts/ci/run-in-console-session.sh python3 tests_v2/verify_terminal_links_12798.py "$CMUX_LINK_APP" "$CMUX_LINK_OUTPUT"
      - name: Upload placement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminal-link-placement-evidence
          path: ${{ runner.temp }}/terminal-link-evidence
          if-no-files-found: warn
          retention-days: 30
